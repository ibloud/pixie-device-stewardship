name: Platform or institutional response
description: Record a constructive public response, correction, counterexample, or implementation update.
title: "[Provider response]: "
labels:
  - provider-response
body:
  - type: input
    id: organization
    attributes:
      label: Organization
    validations:
      required: true
  - type: dropdown
    id: capacity
    attributes:
      label: Capacity
      options:
        - Official organizational response
        - Employee speaking personally
        - Independent researcher or advocate
        - Capacity unclear
    validations:
      required: true
  - type: textarea
    id: position
    attributes:
      label: Position, correction, or counterexample
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source URL
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Recommended change or test
  - type: checkboxes
    id: conduct
    attributes:
      label: Participation agreement
      options:
        - label: I will address claims and methods without diagnosing, threatening, or targeting individuals.
          required: true

