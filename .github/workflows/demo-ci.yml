name: Stewardship demo CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --check demo.js
      - run: node --check demo-model.js
      - run: node --check display-preferences.js
      - run: node --test tests/*.test.js

  atmosphere-guide-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/atmosphere-guide/package-lock.json
      - name: Build guide and verify Field Notes publication
        working-directory: tools/atmosphere-guide
        run: npm ci && npm run build

  notify-atmosphere-production:
    needs: [test, atmosphere-guide-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Request publication from the Pages repository
        env:
          GH_TOKEN: ${{ secrets.ATMOSPHERE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure ATMOSPHERE_DEPLOY_TOKEN with Actions write access to ibloud/atmosphere-field-guide. Scheduled synchronization remains available."
            exit 1
          fi
          gh workflow run deploy.yml --repo ibloud/atmosphere-field-guide --ref main
